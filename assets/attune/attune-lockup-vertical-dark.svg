<svg xmlns="http://www.w3.org/2000/svg" width="158" height="150" viewBox="0 0 158 150">
  <title>Attune — vertical lock-up (dark)</title>
  <desc>Mark 3d4-2r above the wordmark. GENERATED by tools/make_lockup.py — edit that, not this.

  Type is OUTLINED, from the same woff2 files the app bundles, so this renders identically anywhere
  and cannot fall back to Georgia the way live text does (Instrument Serif is not a system font).

  For the App Store listing, the landing hero, the About screen — anywhere with room. The app HEADER
  uses the horizontal lock-up instead (wordmark + "by Warren Labs", no mark): inside the app you
  already know which app you are in, and the 23pt header slot is spoken for.

  The Warren Labs W is deliberately absent. The Attune mark was briefed as a sibling to it — one
  continuous stroke, rounded caps — and two sibling marks in one signature compete rather than nest.
  The W leads wherever Warren Labs is the speaker.</desc>

